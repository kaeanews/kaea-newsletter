name: 발송 실패 추적 (수동)

# ⚠️ 자동 실행(스케줄)이 꺼져 있습니다.
#
# 이유: 이 기능은 스티비 '이메일 API'를 쓰는데, 협회 워크스페이스가
#       프로 요금제가 아니어서 현재 동작하지 않습니다.
#       (스티비 응답: "지원하지 않는 API 입니다. 프로 요금제가 필요합니다.")
#
# 그대로 두면 매일 실패하면서 웹진까지 자동 수집분으로 되돌리므로 스케줄을 껐습니다.
#
# ── 프로 요금제로 올린 뒤 되살리는 방법 ────────────────────────
#   아래 주석 처리된 schedule 블록의 주석(#)만 풀면 매일 KST 11시에 자동 실행됩니다.
# ───────────────────────────────────────────────────────────────

on:
  # ── 자동 실행 중단 (프로 요금제 전까지) ──
  # 되살리려면 아래 3줄의 주석(#)만 풀면 된다.
  # schedule:
  #   - cron: '0 11 * * *'
  #     timezone: 'Asia/Seoul'    # KST 11:00
  workflow_dispatch:            # Actions 탭에서 수동 실행

# 추적 결과(sending_failures.json)를 저장소에 반영하기 위한 쓰기 권한
permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      # 1) 저장소 코드 가져오기
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      # 2) 파이썬 설치
      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3) 필요한 라이브러리 설치
      - name: 라이브러리 설치
        run: pip install requests python-dotenv

      # 4) 발송 실패 추적 (스티비 API)
      #    STIBEE_API_KEY: 스티비 API 키 (Secrets) — 필수
      #    STIBEE_SUBJECT_FILTER(선택): 추적할 이메일 제목 규칙.
      #      비워두면 코드 기본값("한국자동차환경협회 뉴스 모니터링")이 적용된다.
      #      규칙이 바뀔 때만 Secrets 에 등록하면 코드 수정 없이 반영된다.
      #    STIBEE_EMAIL_IDS(선택): 특정 이메일 ID만 추적. 없으면 제목 규칙으로 자동 선별.
      - name: 발송 실패 추적 실행
        env:
          STIBEE_API_KEY: ${{ secrets.STIBEE_API_KEY }}
          STIBEE_SUBJECT_FILTER: ${{ secrets.STIBEE_SUBJECT_FILTER }}
          STIBEE_EMAIL_IDS: ${{ secrets.STIBEE_EMAIL_IDS }}
        run: python stibee.py

      # 5) 대시보드 재생성 (발송 실패 데이터를 대시보드에 반영)
      #    generate.py는 오늘 data 기준으로 dashboard.html을 다시 만든다.
      #    (sending_failures.json을 읽어 발송 실패 탭을 채움)
      - name: 대시보드 재생성
        env:
          # 웹진을 어느 데이터로 만들지 지정한다.
          # Secrets 에 WEBZINE_SOURCE 가 없으면 stibee(현재 운영 방식)로 동작한다.
          # 자동 수집 방식으로 되돌릴 때는 Secrets 에 WEBZINE_SOURCE=auto 를 넣으면 된다.
          WEBZINE_SOURCE: ${{ secrets.WEBZINE_SOURCE }}
        run: |
          export WEBZINE_SOURCE="${WEBZINE_SOURCE:-stibee}"
          echo "웹진 소스: $WEBZINE_SOURCE"
          python generate.py

      # 6) 결과를 저장소에 반영 (변경 있을 때만 커밋)
      - name: 결과 저장소에 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 사항 없음 - 커밋 생략"
          else
            git commit -m "자동: 발송 실패 추적 갱신"
            git push
          fi
