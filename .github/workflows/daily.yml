name: 뉴스 수집 (수동 · 성능 관찰용)

# ⚠️ 이 워크플로우는 웹진을 만들지 않습니다.
#
# 현재 웹진은 '스티비 미러 방식'으로 운영됩니다.
#   담당자가 스티비에서 발송 → mirror.yml 을 수동 실행 → 웹진 갱신
#
# 이 워크플로우는 자동 수집(collect.py)과 필터(filter.py)만 돌려
# data/ 와 stats.json 에 결과를 쌓습니다.
# 수집 성능이 얼마나 좋아졌는지 확인하는 용도입니다.
#
# 자동 실행(스케줄)은 꺼져 있습니다. 필요할 때 Actions 탭에서 수동으로 돌리세요.
#
# ── 나중에 자동 수집 방식으로 되돌릴 때 ─────────────────────────
#   1) 아래 주석 처리된 schedule 블록을 되살린다
#   2) 하단의 '웹진 생성 실행' 단계를 되살린다
#   3) Secrets 의 WEBZINE_SOURCE 를 auto 로 바꾸거나 삭제한다
# ───────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      update_dashboard:
        description: '수집 후 대시보드도 갱신할지 (웹진은 그대로 유지됩니다)'
        required: true
        default: '아니오 (수집만)'
        type: choice
        options:
          - '아니오 (수집만)'
          - '예 (대시보드만 자동수집 결과로 갱신)'

  # schedule:
  #   - cron: '15 5 * * *'
  #     timezone: 'Asia/Seoul'   # KST 05:15
  #   - cron: '15 6 * * *'
  #     timezone: 'Asia/Seoul'   # KST 06:15
  #   - cron: '15 7 * * *'
  #     timezone: 'Asia/Seoul'   # KST 07:15

# 수집 결과를 저장소에 저장(커밋)하기 위한 쓰기 권한
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install requests python-dotenv anthropic

      # 1) 뉴스 수집 (STEP 1) → data/날짜.json
      - name: 뉴스 수집 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # 후보가 정원보다 많을 때 AI가 1차 선별한다.
          # 키가 없으면 기존 균등 배분으로 동작하므로 안전하다.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python collect.py

      # 2) 중복 제거 + 부정 필터 + 중요도 선별 + 요약 (STEP 2) → stats.json 누적
      - name: 부정 필터링 및 요약 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python filter.py

      # 3) (선택) 대시보드만 자동 수집 결과로 갱신
      #    --dashboard-only 라서 index.html·news·검색은 건드리지 않는다.
      #    WEBZINE_SOURCE=auto 로 data/ 를 읽는다.
      - name: 대시보드 갱신 (웹진은 유지)
        if: ${{ inputs.update_dashboard == '예 (대시보드만 자동수집 결과로 갱신)' }}
        env:
          WEBZINE_SOURCE: auto
        run: python generate.py --dashboard-only

      # ※ 웹진 생성은 하지 않습니다.
      #   스티비 미러 방식에서는 mirror.yml 이 웹진과 대시보드를 만듭니다.
      #   여기서 generate.py 를 돌리면 웹진이 자동 수집분으로 덮어써집니다.
      #
      #   [되돌릴 때] 아래 두 줄의 주석을 풀면 자동 수집 방식으로 웹진이 생성됩니다.
      # - name: 웹진 생성 실행
      #   run: python generate.py

      # 3) 수집 결과를 저장소에 반영 (변경 있을 때만 커밋)
      - name: 수집 결과 저장소에 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 사항 없음 - 커밋 생략"
          else
            git commit -m "수동: 뉴스 수집 결과 갱신 (성능 관찰용)"
            git push
          fi
