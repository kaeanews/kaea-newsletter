name: 스티비 발행분 웹진 반영 (수동)

# 담당자가 스티비에서 뉴스레터를 발송한 뒤, 이 워크플로우를 수동으로 실행하면
# 발송된 메일을 가져와 웹진과 대시보드에 반영한다.
#
# 가져오는 방법이 두 가지다.
#   ① 링크 모드  : '웹에서 보기' 링크를 입력란에 붙여넣는다. 요금제 제약 없음.
#   ② API 모드   : 입력란을 비우면 이메일 API로 자동 조회. 스티비 프로 요금제 필요.
#
# 흐름:
#   stibee_mirror.py  스티비 발송분 → mail_data/날짜.json 변환
#   generate.py       웹진·대시보드 재생성 (WEBZINE_SOURCE=stibee)
#   커밋              GitHub Pages 반영
#
# ※ 자동 수집(daily.yml)은 그대로 돌아가며 data/ 에 쌓인다.
#   수집 성능이 만족스러워지면 WEBZINE_SOURCE 를 auto 로 바꿔 되돌리면 된다.
on:
  # ── 자동 실행 ──────────────────────────────────────────────
  # 담당자가 매일 오전 10시경 발송한다.
  #
  # ⚠️ GitHub 예약 실행은 정시가 보장되지 않는다.
  #    10:30·12:00 두 번만 걸어 두었을 때 2026-09-17 ~ 10-21 사이 20일 동안
  #    실제 실행은 전부 15:10 ~ 17:09 에 이루어졌다 (매번 4~5시간 지연).
  #    그래서 평일 10:07 ~ 13:52 사이 15분 간격(16회)으로 촘촘히 걸어,
  #    그중 하나라도 제때 돌면 바로 반영되도록 한다.
  #
  # 자동 실행은 '최근 7일 중 아직 안 가져온 것 전부'를 처리하므로
  #   · 이미 가져온 날은 건너뛴다 (중복 없음) → 뒤따르는 실행은 30초 만에 조용히 끝난다
  #   · 주말·휴일처럼 발송이 없는 날은 조용히 끝난다
  #   · 분(minute)은 :00·:30 을 피했다 (GitHub 혼잡 시간대)
  # ⚠️ GitHub Actions 는 UTC 기준. KST = UTC + 9 (UTC 1~4시 = KST 10~13시, 요일 동일)
  schedule:
    - cron: '7,22,37,52 1-4 * * 1-5'   # 평일 KST 10:07 ~ 13:52, 15분 간격 (16회)
    - cron: '7 6 * * 1-5'              # 평일 KST 15:07 — 위가 전부 밀렸을 때의 마지막 보루

  workflow_dispatch:
    inputs:
      share_url:
        description: "스티비 '웹에서 보기' 링크 (프로 요금제 아닐 때 이걸 쓰세요)"
        required: false
        default: ''
        type: string
      share_date:
        description: '(선택) 발행일 YYYY-MM-DD. 비우면 메일 내용에서 자동 인식'
        required: false
        default: ''
        type: string
      since:
        description: '(선택) 이 날짜 이후 발송분만. 예: 2026-06-01. 비우면 전부'
        required: false
        default: ''
        type: string
      mode:
        description: '변환 범위 (링크를 넣으면 무시됨)'
        required: true
        default: '최신 1건'
        type: choice
        options:
          - '최신 1건'
          - '아직 변환 안 된 것 전부'
          - '목록만 확인 (변환 안 함)'
      email_id:
        description: '(선택) 특정 이메일 ID만 변환할 때 입력'
        required: false
        default: ''
        type: string

permissions:
  contents: write

# 동시 실행 방지.
# 예약이 촘촘해졌으므로, GitHub 가 밀린 실행을 한꺼번에 풀어놓으면 여러 개가 동시에
# 돌면서 같은 메일을 중복 변환(AI 비용 중복)하거나 서로 push 충돌을 낼 수 있다.
# → 같은 그룹은 한 번에 하나만 돈다. 돌고 있는 것은 끝까지 보내고(cancel-in-progress: false),
#   대기 중인 것은 가장 최근 하나만 남기고 나머지는 '취소됨'으로 정리된다.
#   ※ Actions 목록에 '취소됨(cancelled)'이 보이면 이 설정이 동작한 것이지 오류가 아니다.
concurrency:
  group: stibee-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install requests anthropic python-dotenv

      # 0) 목록만 확인하는 진단 모드
      #    어떤 메일이 있는지 제목만 훑어본다. 변환·비용이 발생하지 않는다.
      - name: 발송 메일 목록 확인
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == '목록만 확인 (변환 안 함)' }}
        env:
          STIBEE_API_KEY: ${{ secrets.STIBEE_API_KEY }}
          STIBEE_SUBJECT_FILTER: ${{ secrets.STIBEE_SUBJECT_FILTER }}
          SINCE: ${{ inputs.since }}
        run: |
          if [ -n "$SINCE" ]; then
            python stibee_list.py --since "$SINCE"
          else
            python stibee_list.py
          fi

      # 1) 스티비 발송분을 웹진 데이터로 변환
      #    변환 건수를 outputs.converted 로 넘겨, 0건이면 뒤 단계를 건너뛴다.
      #    (메일을 못 찾았는데 웹진 재생성에서 실패해 원인이 가려지는 것을 막기 위함)
      - name: 스티비 발행분 가져오기
        id: fetch
        if: ${{ github.event_name == 'schedule' || inputs.mode != '목록만 확인 (변환 안 함)' }}
        env:
          STIBEE_API_KEY: ${{ secrets.STIBEE_API_KEY }}
          STIBEE_SUBJECT_FILTER: ${{ secrets.STIBEE_SUBJECT_FILTER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ inputs.mode }}
          EMAIL_ID: ${{ inputs.email_id }}
          SHARE_URL: ${{ inputs.share_url }}
          SHARE_DATE: ${{ inputs.share_date }}
          SINCE: ${{ inputs.since }}
        run: |
          # ① 링크 모드 — 프로 요금제가 없어도 동작한다
          if [ -n "$SHARE_URL" ]; then
            if [ -n "$SHARE_DATE" ]; then
              python stibee_mirror.py --url "$SHARE_URL" --date "$SHARE_DATE"
            else
              python stibee_mirror.py --url "$SHARE_URL"
            fi
          # ② API 모드 — 프로 요금제 필요
          elif [ -n "$EMAIL_ID" ]; then
            # 숫자인지 확인 (잘못된 값이 그대로 넘어가지 않도록)
            if ! echo "$EMAIL_ID" | grep -Eq '^[0-9]+$'; then
              echo "[오류] 이메일 ID는 숫자여야 합니다: $EMAIL_ID"
              exit 1
            fi
            python stibee_mirror.py --email "$EMAIL_ID"
          else
            # 자동 실행(스케줄)이면 입력값이 비어 있다.
            # → 최근 7일 중 아직 안 가져온 것 전부로 동작시킨다.
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              MODE="아직 변환 안 된 것 전부"
              SINCE=$(TZ=Asia/Seoul date -d '7 days ago' +%Y-%m-%d)
              echo "[자동 실행] 실제 실행 시각(KST) $(TZ=Asia/Seoul date +%H:%M) — 예약 시각과 비교해 지연 여부를 확인할 수 있다"
              echo "[자동 실행] 최근 7일($SINCE 이후) 중 미변환분 처리"
            fi

            # 시작 날짜(선택) 검증
            SINCE_ARG=""
            if [ -n "$SINCE" ]; then
              if ! echo "$SINCE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
                echo "[오류] 날짜 형식이 올바르지 않습니다: $SINCE (예: 2026-06-01)"
                exit 1
              fi
              SINCE_ARG="--since $SINCE"
            fi

            if [ "$MODE" = "아직 변환 안 된 것 전부" ]; then
              python stibee_mirror.py --all $SINCE_ARG
            else
              python stibee_mirror.py $SINCE_ARG
            fi
          fi

      # 2) 변환된 게 없으면 여기서 안내하고 정상 종료
      - name: 변환 결과 확인
        if: steps.fetch.outputs.converted == '0'
        run: |
          echo "::notice::변환된 메일이 없어 웹진을 갱신하지 않았습니다."
          echo "위 '스티비 발행분 가져오기' 단계의 로그에서 원인을 확인하세요."
          echo "  · 제목 규칙이 안 맞으면 → 실제 발송 제목이 로그에 표시됩니다"
          echo "  · 발송 완료된 메일이 없으면 → 담당자 발송 여부를 확인하세요"
          echo "  · 자동 실행이고 오늘 분이 이미 반영돼 있으면 → 정상입니다 (촘촘한 예약 중 뒤따르는 실행)"

      # 3) 웹진·대시보드 재생성 (스티비 발행분 기준)
      - name: 웹진 재생성
        if: steps.fetch.outputs.converted != '0'
        env:
          WEBZINE_SOURCE: stibee
        run: python generate.py

      # 4) 결과 반영
      #    다른 실행이 먼저 push 했을 수 있으므로, 실패하면 최신을 받아 한 번 더 시도한다.
      - name: 결과 저장소에 반영
        if: steps.fetch.outputs.converted != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 사항 없음 - 커밋 생략"
          else
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              git commit -m "자동: 스티비 발행분 웹진 반영"
            else
              git commit -m "수동: 스티비 발행분 웹진 반영"
            fi
            git push || (git pull --rebase origin main && git push)
          fi
